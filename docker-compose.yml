# Airawat LOCAL OS-plane stack (ADR-0084) — a developer's own OS install, FEDERATED to the ONE shared Network.
#
# Runs the OS plane locally: postgres (tenant registry) + vault (local secrets) + kernel + identity + secrets +
# filestore + app-host. It does NOT run its own network authority — NETWORK_URL points at the shared EC2 Network
# (https://airos.airawat.org/network), so this install is a PARTICIPANT of the same network as everyone else
# (governance / certification / directory / steward-signing stay shared). See docs/decisions/ADR-0084.
#
#   docker compose up -d --build         # kernel builds from ./kernel; reference svcs reuse airawatos-reference:0.2.0-local
#
# NOTE (ADR-0084 S1 pending): governance calls (propose schema, publish) will be REJECTED by the shared Network until
# it is taught to TRUST this local identity's JWKS issuer (per-issuer JWKS federation). Until then this stack is for
# local login + local registry + serving the apps; the shared-network govern round-trip lights up after S1.
name: airawat-local
x-ref: &ref
  image: airawatos-reference:0.2.1-local     # built locally (arm64); ADR-0085 S4 overlay (publish carries source_file_id)
  restart: unless-stopped
  extra_hosts: [ "host.docker.internal:host-gateway" ]

services:
  postgres:
    image: postgres:16-alpine
    container_name: airawat-local-postgres
    environment: { POSTGRES_DB: kernel, POSTGRES_USER: kernel, POSTGRES_PASSWORD: kernel }
    shm_size: 256mb
    volumes: [ local_pg:/var/lib/postgresql/data ]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U kernel"], interval: 5s, timeout: 5s, retries: 10 }
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.15
    container_name: airawat-local-vault
    cap_add: [ IPC_LOCK ]
    environment: { VAULT_DEV_ROOT_TOKEN_ID: airawat-dev-root, VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200 }
    command: server -dev
    # no host port — reached in-network as vault:8200; admin via `docker exec airawat-local-vault vault ...`
    healthcheck: { test: ["CMD","vault","status","-address=http://127.0.0.1:8200"], interval: 5s, timeout: 3s, retries: 15 }
    restart: unless-stopped

  # LOCAL network — Part 3(A) TEST HARNESS only. ADR-0084's real topology points at the SHARED EC2 network;
  # this local network exists to prove the per-tenant-issuer + multi-issuer-verify + govern round-trip
  # end-to-end with zero production exposure. It TRUSTS the local identity's per-tenant issuers.
  network:
    image: airawatos/network:0.2.0-local
    container_name: airawat-local-network
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: kernel
      DB_USER: kernel
      DB_PASSWORD: kernel
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: airawat-dev-root
      IDENTITY_JWKS: http://identity:8093/jwks
      IDENTITY_URL: http://identity:8093
      EXPECTED_AUDIENCE: airawatos
      TRUSTED_ISSUERS: '{"ds:airawat:identity":"http://identity:8093/jwks","ds:airawatdeveloper:identity":"http://identity:8093/jwks","ds:kmc:identity":"http://identity:8093/jwks"}'
    depends_on:
      postgres: { condition: service_healthy }
      vault: { condition: service_healthy }
    healthcheck: { test: ["CMD","python","-c","import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/v1/health').status==200 else 1)"], interval: 5s, timeout: 5s, retries: 10 }
    restart: unless-stopped

  kernel:
    build: { context: ./kernel, dockerfile: deploy/Dockerfile }
    image: airawatos/kernel:0.2.0-local
    container_name: airawat-local-kernel
    environment:
      REGISTRY_BACKEND: postgres
      DB_HOST: postgres
      NETWORK_URL: https://airos.airawat.org/network      # ADR-0084: federate to the SHARED EC2 Network
      IDENTITY_JWKS: http://identity:8093/jwks             # verify LOCAL user tokens against the local identity
      KERNEL_REQUIRE_STEWARD_GRANT: "0"                    # DEV install: relax the steward-grant gate for local writes (INT-0004 dev-relaxation)
      # ADR-0091 V3c: verb-alias + lifecycle DECLARATIONS are steward-owned platform config, read (never written)
      # by every tenant via the ADR-0066 shared mechanism (own-tenant ∪ shared steward). No read-gate change.
      SHARED_SCHEMAS: "knowledge.document,knowledge.version,knowledge.chunk,knowledge.embedding,governance.rule,platform.verb_alias,platform.lifecycle"
      SECRETS_URL: http://secrets:8102
      SECRETS_INTERNAL: airawat-broker-secrets-internal
      FILESTORE_URL: http://filestore:8095
      APPS_OVERLAY: /data/app-bundles/apps
    ports: [ "8081:8080" ]   # host 8081 (old airawat-stack still holds 8080)
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  identity:
    <<: *ref
    container_name: airawat-local-identity
    command: ["python","reference/identity.py"]
    # VAULT → a STABLE Ed25519 signing key (transit), so restarting identity doesn't invalidate issued tokens /
    # rotate the JWKS the shared Network will be pinned to (ADR-0084 S1).
    environment:
      NETWORK_URL: https://airos.airawat.org/network
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: airawat-dev-root
      IDENTITY_USERS_FILE: /data/identity/identity-users.json
      IDENTITY_PER_TENANT_ISSUER: "1"   # ADR-0084 S1: issue as ds:<tenant>:identity with a per-tenant key
    volumes:
      - local_identity:/data/identity
    ports: [ "8093:8093" ]
    depends_on:
      vault: { condition: service_healthy }

  secrets:
    <<: *ref
    container_name: airawat-local-secrets
    command: ["python","reference/secrets.py"]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: airawat-dev-root
      SECRETS_INTERNAL: airawat-broker-secrets-internal
      IDENTITY_JWKS: http://identity:8093/jwks
    depends_on: { vault: { condition: service_healthy } }

  filestore:
    <<: *ref
    container_name: airawat-local-filestore
    command: ["python","reference/filestore.py","--port","8095"]
    environment:
      FILESTORE_DIR: /data/filestore
    volumes:
      - local_filestore:/data/filestore

  app-host:
    <<: *ref
    container_name: airawat-local-app-host
    image: airawatos-reference:0.2.1-local-rule   # ADR-0088-S1 local rule-engine overlay
    command: ["python","reference/app_host.py","/app/components/apps","--port","8099",
              "--network","https://airos.airawat.org/network","--kernel","http://kernel:8080",
              "--identity","http://identity:8093","--secrets","http://secrets:8102","--no-verify-cert"]
    environment:
      FILESTORE_URL: http://filestore:8095
    ports: [ "8099:8099" ]
    volumes:
      - local_appbundles:/data/app-bundles
    depends_on:
      kernel: { condition: service_started }
      identity: { condition: service_started }

volumes:
  local_pg: {}
  local_identity: {}
  local_filestore: {}
  local_appbundles: {}
