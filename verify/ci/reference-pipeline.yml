# REFERENCE pipeline definition (slice-1d) — a HANDOVER artefact, not wired into any CI system.
# Written in GitHub Actions syntax because it is the most widely readable; the steps are plain `make` targets, so
# any CI/CD system with a Docker-capable runner can host it. Copy into the team's CI (e.g. .github/workflows/) and
# adjust runner labels, caching and secrets handling there.
#
# Runner requirements: Linux x86_64 or arm64 with Docker Engine + compose v2 and access to the Docker socket;
# ~8 vCPU / 16 GB RAM / 40 GB disk; outbound access to the image registry (images are pulled by the installer) and
# to the gitleaks/trivy images + the trivy vulnerability DB. The five repositories checked out side by side under
# one root (root, platform-spec, kernel, network, components), as in local development.
name: verify
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"          # nightly: catches new CVEs against unchanged code (scans)
jobs:
  static:                        # fast, no stack: fails the PR early
    runs-on: [self-hosted, docker]
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }
      - name: checkout the four sibling repositories at the matching branch
        run: ./verify/ci/checkout-siblings.sh   # team-provided: clone platform-spec, kernel, network, components
      - run: make banned
      - run: make decide-unit
  full:                          # fresh install + every net; required for merge
    needs: static
    runs-on: [self-hosted, docker]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: ./verify/ci/checkout-siblings.sh
      - run: make verify
      - name: publish the status matrix + results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assurance-results
          path: |
            docs/specs/STATUS-MATRIX.md
            docs/specs/STATUS-MATRIX.json
            conformance/results/
