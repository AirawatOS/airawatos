# AirawatOS local reverse proxy — single front door on http://localhost.
# /network → the AirawatNetwork authority, /kernel → the OS kernel API, everything else → the app-host
# (landing, login, desktop, apps, bridges). Uses Docker's embedded DNS so a recreated service is re-resolved.
server {
    listen 80 default_server;
    server_name localhost;
    client_max_body_size 64m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location /network/ {
        set $up_network network:8090;
        rewrite ^/network/(.*)$ /$1 break;
        proxy_pass http://$up_network;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /kernel/ {
        set $up_kernel kernel:8080;
        rewrite ^/kernel/(.*)$ /$1 break;
        proxy_pass http://$up_kernel;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $up_app app-host:8099;
        proxy_pass http://$up_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
