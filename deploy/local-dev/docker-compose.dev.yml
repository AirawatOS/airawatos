# AirawatOS — LOCAL-DEV stack, built FROM SOURCE (committed hashes), separate from deploy/local/.
#   kernel      = manishsv/airawatos-kernel:dev-hard4     (kernel feat/admin-issuer-scope)
#   network     = manishsv/airawatos-network:dev-a72    (network feat/trust-plane-phase1; mint-on-demand TRUST_READ_TOKEN)
#   reference   = manishsv/airawatos-reference:dev-hard8  (platform-spec feat/network-console-multinetwork)
#     (components feat/network-console-multinetwork @ 0250c71 delivered from the working tree at install)
# NO data-mount here (that is kernel/platform-spec feat/data-mount — a later slice).
#
# Separate project `airawatos-localdev`, `airawat-ld-*` containers, localdev_* volumes, front door on
# 127.0.0.1:8080 — coexists with deploy/local without collision. Dev conveniences are GATED behind the dev
# profile; the prod-guard refuses to start under AIRAWAT_ENV=production with any convenience on. The Kernel
# ENFORCES the local issuer + audience (never shadow).
name: airawatos-localdev

# ── SINGLE SOURCE for the local identity envelope — change here, fans out to kernel + network + identity ──
x-identity-issuer: &iss ds:localdev:identity
x-identity-audience: &aud airawatos-localdev

x-devenv: &devenv
  AIRAWAT_ENV: development            # dev profile — the prod-guard is a no-op here
  AIRAWAT_PROFILE: dev
  AIRAWAT_ALLOW_PASSWORDLESS: "1"     # reference IdP passwordless dev auth (gated: prod-guard blocks under production)

x-ref: &ref                          # one source-built reference image; many services (per-service command)
  image: manishsv/airawatos-reference:dev-hard18   # + 1c-iv-c (identity svc:identity) + step 2 (runtime-manager; scheduler delegates; clean-env launcher) + step 3 (scheduler-owned pipelines)
  restart: unless-stopped
  entrypoint: ["/bin/sh","/local-dev/prod-guard.sh"]     # production guard (effective-settings check)
  volumes: [ ./prod-guard.sh:/local-dev/prod-guard.sh:ro ]
  environment: { <<: *devenv }
  depends_on: { kernel: { condition: service_started } }

# ADR-0124 — the reference-plane daemons (scheduler/automation/event-relay) authenticate as their OWN
# provisioned principal (scheduler@<instance>-operator) with a VAULT-backed password, minting a short-lived
# audience-bound token. No passwordless bare-login. The scheduler credential is seeded by ensure_install into
# Vault at secret/data/localdev-operator/scheduler/password.
x-svc-identity: &svcid
  <<: *devenv
  IDENTITY_URL: http://identity:8093
  VAULT_ADDR: http://vault:8200
  SERVICE_PRINCIPAL: scheduler
  SERVICE_TENANT: localdev-operator
  SERVICE_TOKEN_AUDIENCE: *aud

services:
  # ── infrastructure ────────────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: airawat-ld-postgres
    networks: [aos-data-facts]
    environment: { POSTGRES_DB: kernel, POSTGRES_USER: kernel, POSTGRES_PASSWORD: kernel }
    volumes: [ localdev_pg:/var/lib/postgresql/data ]     # DURABLE (AIRAWAT_EPHEMERAL_OK unset)
    healthcheck: { test: ["CMD-SHELL","pg_isready -U kernel"], interval: 5s, timeout: 5s, retries: 10 }
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.20@sha256:268bb80aa9c6d13d65fcfa05c0c268caca068952240a8087291a6ce0b66e3a10   # L1-1b step8: off EOL Alpine 3.18 → Vault 1.20.4 / Alpine 3.22, pinned by digest
    container_name: airawat-ld-vault
    networks: [aos-data-secrets]
    cap_add: [ IPC_LOCK ]
    environment: { VAULT_ADDR: http://127.0.0.1:8200 }
    volumes:
      - localdev_vault:/vault/data
      - ./vault/vault.hcl:/vault/config/vault.hcl:ro
      - ./vault/entrypoint.sh:/usr/local/bin/airawat-vault-entrypoint.sh:ro
    entrypoint: ["/bin/sh","/usr/local/bin/airawat-vault-entrypoint.sh"]
    healthcheck: { test: ["CMD","vault","status"], interval: 5s, timeout: 3s, retries: 30 }
    restart: unless-stopped

  # ── platform core ─────────────────────────────────────────────────────────────────────────────────
  kernel:
    image: manishsv/airawatos-kernel:dev-hard8   # + slice-1c-iv step 3: scheduler-only /v1/components/run-token
    container_name: airawat-ld-kernel
    env_file: [ ./vault/approle/kernel.env ]   # L1-1b: per-service Vault AppRole (role-id+secret-id); replaces shared VAULT_TOKEN
    networks: [aos-svc, aos-data-facts, aos-data-secrets, aos-component]  # aos-component: the broker is the ONLY door a placed component can reach (step 3)
    entrypoint: ["/bin/sh","/local-dev/prod-guard.sh"]
    command: ["uvicorn","api.app:app","--host","0.0.0.0","--port","8080"]   # entrypoint override clears image CMD → set it
    volumes: [ ./prod-guard.sh:/local-dev/prod-guard.sh:ro ]
    environment:
      <<: *devenv
      REGISTRY_BACKEND: postgres
      RUNTIME_MANAGER_URL: http://runtime-manager:8105    # slice-1c-iv step 2 — warm-connector ensure (svc:runtime-manager)
      DB_HOST: postgres
      # 4b least-privilege: kernel runs as NON-SUPERUSER kernel_app (DML only on registry_version /
      # registry_schema_meta / kernel_admin_audit / kernel_kv). Password from Vault — no compose literal.
      # It owns NO DDL: the migrator (installer / db_migrate) pre-creates every table, so REGISTRY_SKIP_DDL
      # and KV_SKIP_DDL are both on. Denied network_kv + identity_login_fails (proven at boot).
      DB_USER: kernel_app
      DB_PASSWORD_VAULT_PATH: secret/data/localdev/kernel-app/password
      VAULT_ADDR: http://vault:8200
      REGISTRY_SKIP_DDL: "1"
      KV_SKIP_DDL: "1"
      NETWORK_URL: http://network:8090
      IDENTITY_JWKS: http://identity:8093/jwks
      # slice-1c-ii — the kernel's OWN service identity (ADR-0124): mints svc:model-gateway (/v1/complete
      # forward) + svc:filestore (broker file put/get) tokens via svc_token, reading its password from Vault.
      IDENTITY_URL: http://identity:8093
      SERVICE_PRINCIPAL: kernel
      SERVICE_TENANT: localdev-operator
      KERNEL_REQUIRE_STEWARD_GRANT: "1"
      DEV_REQUIRE_DEVELOPER: "1"
      SCHEMA_VALIDATE: strict                               # not shadow
      # ADR-0124 — component.publisher is a SCOPED platform-service principal (publishes component_asset +
      # verb_binding cross-tenant), NOT an admin: it is NOT in _ADMIN_ROLES, so it stays refused at every
      # admin / network-admin / secrets gate. (default set + component.publisher)
      PLATFORM_SERVICE_ROLES: "platform.steward,platform.scheduler,platform.service,component.publisher"
      # §8 — ENFORCE the local issuer + audience (IDENTITY_AUD_ISS_SHADOW deliberately UNSET = hard 401 on mismatch)
      IDENTITY_EXPECTED_ISS: *iss
      IDENTITY_EXPECTED_AUD: *aud
      IDENTITY_HOME_ISS: *iss                               # issuer-scoped admin/publisher authority = the local home issuer (hardening)
      SHARED_SCHEMAS: "knowledge.document,knowledge.version,knowledge.chunk,knowledge.embedding,governance.rule,platform.verb_alias,platform.lifecycle"
      EVENT_SINK: http://automation:8098/events
      SECRETS_URL: http://secrets:8102
      FILESTORE_URL: http://filestore:8095
      EMBED_URL: http://model-gateway:8104
      APPS_OVERLAY: /data/app-bundles/apps
    depends_on:
      postgres: { condition: service_healthy }
      vault: { condition: service_healthy }
      network: { condition: service_healthy }
    restart: unless-stopped

  network:
    image: manishsv/airawatos-network:dev-a77   # slice-1c-iv-c: join→provision mints svc:identity as provisioner (Vault)
    container_name: airawat-ld-network
    env_file: [ ./vault/approle/network.env ]   # L1-1b: per-service Vault AppRole (role-id+secret-id); replaces shared VAULT_TOKEN
    networks: [aos-edge, aos-svc, aos-data-facts, aos-data-secrets]
    entrypoint: ["/bin/sh","/local-dev/prod-guard.sh"]
    command: ["sh","-c","exec uvicorn api:app --host 0.0.0.0 --port 8090"]   # entrypoint override clears image CMD → set it
    environment:
      <<: *devenv
      NET_FILES_DIR: /data/netfiles
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: kernel
      # 4b least-privilege: network runs as NON-SUPERUSER network_app (DML only on network_kv). Password from
      # Vault — no compose literal. It owns NO DDL: the migrator pre-creates network_kv, so KV_SKIP_DDL is on.
      # Denied registry_version / kernel_kv / identity_login_fails (proven at boot).
      DB_USER: network_app
      DB_PASSWORD_VAULT_PATH: secret/data/localdev/network-app/password
      KV_SKIP_DDL: "1"
      VAULT_ADDR: http://vault:8200
      IDENTITY_JWKS: http://identity:8093/jwks
      IDENTITY_URL: http://identity:8093
      IDENTITY_PROVISIONER_TENANT: localdev-operator         # ADR-0131 — join→provision mints svc:identity as provisioner@<this realm> (Vault)
      EXPECTED_AUDIENCE: *aud                               # network token-aud check must match the local IdP audience (§8 alignment)
      IDENTITY_HOME_ISS: *iss                               # issuer-scoped admin/publisher authority = the local home issuer (hardening)
      NETWORK_ADMIN_AUTHZ: role                             # Commit-D role-based admin authz (local-dev validation; global all-or-nothing)
      # Role-mode Trust reader — mint-on-demand (NO manual token): the network mints a short-lived read token
      # for a dedicated READ-ONLY principal (role []; never platform.service) from the LOCAL identity service,
      # using a password held in VAULT (bootstrap-dev.sh provisions both), and caches it until shortly before
      # expiry. Fail-closed if the mint fails. (A static TRUST_READ_TOKEN, if ever set, still wins — tests only.)
      KERNEL_URL: http://kernel:8080
      TRUST_READER_TENANT: localdev-network                 # reader's home realm = where the Trust records' steward lives
      TRUST_READER_PRINCIPAL: trust-reader                  # dedicated read-only service principal
      TRUST_READER_VAULT_PATH: secret/data/localdev-network/trust-reader/password   # KV v2; value under .data.data.value
      # ADR-0119 Trust plane (console `networks/mine` + governance endpoints) — enabled DURABLY, secrets from
      # VAULT not compose: the registry bearer is mint-on-demand (reuses the trust-reader credential above, no
      # TRUST_REGISTRY_TOKEN), and the audit HMAC is read from Vault (bootstrap-dev.sh Phase 6 provisions it).
      # authority_tenant=airawat → no local principal is platform-authority, so networks/mine is role-scoped.
      TRUST_PLANE_ENABLED: "1"
      TRUST_KERNEL_URL: http://kernel:8080
      TRUST_AUTHORITY_TENANT: airawat                       # is_platform_authority identity (no local principal is in it → role-scoped)
      PLATFORM_AUTHORITY_MODE: enforce                      # ADR-0122 P4 cutover: is_platform_authority = recorded platform.authority role ONLY, no tenant fallback (bootstrap phase 4b seeds the local steward). EC2 default stays "shadow".
      TRUST_WRITE_STEWARD: localdev-network                 # store WRITE/ownership steward = where the Trust records live (ds:localdev-network:)
      TRUST_ENFORCE_STEWARD_PROVENANCE: "1"                 # ADR-0124 / DEBT-A70 — steward role checks now DROP role_assignments lacking governance provenance (op_id + role.assign audit). Enabled after the one-time reseed migrated every steward seed through GovernanceService.assign_role. EC2 default stays OFF until its seeds are migrated.
      TRUST_AUDIT_HMAC_VAULT_PATH: secret/data/localdev-network/trust-plane/audit_hmac
      # Governance WRITES persist via a DEDICATED trust-writer principal (own-tenant write to the steward
      # above; role []; NEVER platform.service), minted on demand from Vault — separate from trust-reader.
      TRUST_WRITER_TENANT: localdev-network
      TRUST_WRITER_PRINCIPAL: trust-writer
      TRUST_WRITER_VAULT_PATH: secret/data/localdev-network/trust-writer/password
      ENSURE_DEV_TENANT: "0"                                # operator-first; bootstrap-dev.sh provisions
    depends_on:
      postgres: { condition: service_healthy }
      vault: { condition: service_healthy }
    healthcheck: { test: ["CMD","python","-c","import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/v1/health').status==200 else 1)"], interval: 5s, timeout: 5s, retries: 20 }
    restart: unless-stopped
    volumes:
      - ./prod-guard.sh:/local-dev/prod-guard.sh:ro
      - localdev_netfiles:/data/netfiles

  identity:
    <<: *ref
    container_name: airawat-ld-identity
    env_file: [ ./vault/approle/identity.env ]   # L1-1b: per-service Vault AppRole (role-id+secret-id); replaces shared VAULT_TOKEN
    networks: [aos-svc, aos-data-facts, aos-data-secrets]
    command: ["python","reference/identity.py"]
    environment:
      <<: *devenv
      NETWORK_URL: http://network:8090
      VAULT_ADDR: http://vault:8200
      SERVICE_TENANT: localdev-operator                     # ADR-0131 — the operator realm identity self-bootstraps from (admin + provisioner, create-only)
      IDENTITY_USERS_FILE: /data/identity/identity-users.json
      IDENTITY_PASSWORDS_FILE: /data/identity/identity-passwords.json
      IDENTITY_PASSWORD_REQUIRED: enforce                   # ADR-0124 Step 4 — passwordless login REFUSED
      IDENTITY_SEED_DEMO: ""                                # de-seeded (operator-first); bootstrap provisions admins
      IDENTITY_ISSUER: *iss
      IDENTITY_AUDIENCE: *aud
      # Durable + shared brute-force lockout store (ADR-0121). LEAST-PRIVILEGE role identity_lockout — access
      # ONLY to identity_login_fails, NOT the registry/audit tables (docs/security/IDENTITY-DB-LEAST-PRIVILEGE.md).
      # Password is read from Vault at startup — no literal here.
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: kernel
      DB_USER: identity_lockout
      DB_PASSWORD_VAULT_PATH: secret/data/localdev/identity-lockout/password
      IDENTITY_LOCKOUT_RECHECK_SECONDS: "10"                 # re-probe the durable store this often while degraded
    volumes:
      - ./prod-guard.sh:/local-dev/prod-guard.sh:ro
      - localdev_identity:/data/identity
    depends_on:
      network: { condition: service_healthy }
      vault: { condition: service_healthy }
      postgres: { condition: service_healthy }

  # ── supporting services ───────────────────────────────────────────────────────────────────────────
  secrets:
    <<: *ref
    container_name: airawat-ld-secrets
    env_file: [ ./vault/approle/secrets.env ]   # L1-1b: per-service Vault AppRole (role-id+secret-id); replaces shared VAULT_TOKEN
    networks: [aos-svc, aos-data-secrets]
    command: ["python","reference/secrets.py"]
    environment:
      <<: *devenv
      VAULT_ADDR: http://vault:8200
      IDENTITY_JWKS: http://identity:8093/jwks
    depends_on: { vault: { condition: service_healthy } }

  filestore:
    <<: *ref
    container_name: airawat-ld-filestore
    networks: [aos-svc]
    command: ["python","reference/filestore.py","--port","8095"]
    # slice-1c-ii: ENFORCE (shadow flag removed) — app-host/kernel/launcher all mint svc:filestore now.
    environment: { <<: *devenv, FILESTORE_DIR: /data/filestore, IDENTITY_URL: http://identity:8093 }
    depends_on: {}
    volumes:
      - ./prod-guard.sh:/local-dev/prod-guard.sh:ro
      - localdev_filestore:/data/filestore

  model-gateway:
    <<: *ref
    container_name: airawat-ld-model-gateway
    env_file: [ ./vault/approle/model-gateway.env ]   # L1-1b: per-service Vault AppRole (role-id+secret-id); replaces shared VAULT_TOKEN
    networks: [aos-svc, aos-data-secrets]
    # slice-1c-ii: ENFORCE (shadow flag removed) — kernel mints svc:model-gateway for /complete, app-host for
    # /embed,/transcribe,/admin/provider-key. GW_INTERNAL_TOKEN retired (provider-key now svc:model-gateway-gated).
    environment: { <<: *devenv, GW_REASONING_BUDGET: "1200", VAULT_ADDR: http://vault:8200, IDENTITY_URL: http://identity:8093 }
    command: ["python","reference/model_gateway.py","--kernel","http://kernel:8080","--vault","http://vault:8200"]

  # ── active-loop engines ─────────────────────────────────────────────────────────────────────────────
  notify:
    <<: *ref
    container_name: airawat-ld-notify
    networks: [aos-svc]
    command: ["python","reference/notify.py","--kernel","http://kernel:8080"]
    # slice-1c-ii: ENFORCE (shadow flag removed) — decision + workflow now mint svc:notify.
    environment: { <<: *devenv, IDENTITY_URL: http://identity:8093 }
  workflow:
    <<: *ref
    container_name: airawat-ld-workflow
    env_file:
      - path: ./vault/approle/workflow.env   # slice-1c-ii: per-service Vault AppRole (installer-seeded); required:false so a pre-install `up` tolerates its absence
        required: false
    networks: [aos-svc, aos-data-secrets]
    command: ["python","reference/workflow.py","--kernel","http://kernel:8080","--network","http://network:8090"]
    environment: { <<: *svcid, SERVICE_PRINCIPAL: workflow }   # slice-1c-ii: mints svc:notify for the workflow→notify edge
  decision:
    <<: *ref
    container_name: airawat-ld-decision
    env_file:
      - path: ./vault/approle/decision.env   # slice-1c-ii: per-service Vault AppRole (installer-seeded); required:false so a pre-install `up` tolerates its absence
        required: false
    networks: [aos-svc, aos-data-secrets]
    command: ["python","reference/decision.py","--kernel","http://kernel:8080","--network","http://network:8090","--workflow","http://workflow:8097"]
    environment: { <<: *svcid, SERVICE_PRINCIPAL: decision }   # slice-1c-ii: mints svc:notify for the decision→notify edge
  automation:
    <<: *ref
    container_name: airawat-ld-automation
    env_file: [ ./vault/approle/automation.env ]   # L1-1b: per-service Vault AppRole (role-id+secret-id); replaces shared VAULT_TOKEN
    networks: [aos-svc, aos-data-secrets]
    command: ["python","reference/automation.py","--kernel","http://kernel:8080"]
    environment: *svcid   # slice-1c: gate ENFORCE is the code default (was AUTOMATION_EVENTS_REQUIRE_TOKEN:"1")
    depends_on:
      kernel: { condition: service_started }
      vault: { condition: service_healthy }
  event-relay:
    <<: *ref
    container_name: airawat-ld-event-relay
    env_file: [ ./vault/approle/event-relay.env ]   # L1-1b: per-service Vault AppRole (role-id+secret-id); replaces shared VAULT_TOKEN
    networks: [aos-svc, aos-data-secrets]
    command: ["python","reference/event_relay.py","--kernel","http://kernel:8080","--automation","http://automation:8098"]
    environment: *svcid
    depends_on:
      kernel: { condition: service_started }
      vault: { condition: service_healthy }
  scheduler:
    <<: *ref
    container_name: airawat-ld-scheduler
    env_file: [ ./vault/approle/scheduler.env ]   # L1-1b: per-service Vault AppRole (role-id+secret-id); replaces shared VAULT_TOKEN
    networks: [aos-svc, aos-data-secrets]
    command: ["python","reference/scheduler.py","--components-root","/app/components","--kernel","http://kernel:8080","--network","http://network:8090"]
    # ADR-0124 item 1 — gate /run+/reload (callers wired). RUNTIME_NETWORK confines any container the launcher
    # PLACES to aos-component (broker-only egress — ARC-1/DEBT-B52); the broker is reachable there as kernel:8080.
    # NOTE: local-dev mounts no docker.sock, so the default path is the IN-PROCESS subprocess (host-env inherit,
    # DEBT-B51 — a Layer-7 confinement fix, not closable by network segmentation); the container-placement path
    # this confines is exercised on EC2/runtime-manager.
    # slice-1c-iv step 2 — installed runs go to the RUNTIME MANAGER (the placement authority); the scheduler executes
    # nothing itself. AIRAWAT_INPROCESS_COMPONENTS is the EXPLICIT dev flag that admits the ADR-0051 dev-Test draft
    # path (in-process, dev tenant only); the prod-guard refuses it under production (DEBT-B51).
    environment:
      <<: *svcid
      RUNTIME_NETWORK: aos-component
      RUNTIME_MANAGER_URL: http://runtime-manager:8105
      AIRAWAT_INPROCESS_COMPONENTS: "1"                    # DEV ONLY — dev-Test drafts; installed runs never use it
    depends_on:
      kernel: { condition: service_started }
      vault: { condition: service_healthy }
      runtime-manager: { condition: service_started }

  # ── placement authority (slice-1c-iv step 2) ──────────────────────────────────────────────────────────
  # The ONE holder of execution power (ADR-0030/0058). Gate: svc:runtime-manager from {kernel, launcher, scheduler}
  # (always enforce; anon 401, wrong-aud/undeclared 403). Declared networks: aos-svc (its callers — scheduler,
  # kernel — and its own calls: identity JWKS, network cert-resolve, filestore source, secrets /materialize) +
  # aos-data-secrets (Vault, ONLY to read the `launcher` principal's password and mint the launcher's
  # svc:secrets/svc:filestore tokens). Local-dev mounts NO docker.sock: certified-container placement
  # (runtime.profile) is refused (exit 89) here and exercised on EC2; keyless components run in-process in THIS
  # container under a CLEAN env (launcher) — never the scheduler's, never this container's Vault token.
  runtime-manager:
    <<: *ref
    container_name: airawat-ld-runtime-manager
    env_file: [ ./vault/approle/runtime-manager.env ]
    networks: [aos-svc, aos-data-secrets]
    command: ["python","reference/runtime_manager.py","--port","8105"]
    environment:
      <<: *devenv
      COMPONENTS_ROOT: /app/components
      IDENTITY_URL: http://identity:8093
      IDENTITY_JWKS: http://identity:8093/jwks
      VAULT_ADDR: http://vault:8200
      SERVICE_TENANT: localdev-operator                    # the `launcher` principal's realm
      AIRAWAT_API: http://kernel:8080
      KERNEL_ALIAS: kernel
      NETWORK_URL: http://network:8090
      FILESTORE_URL: http://filestore:8095
      SECRETS_URL: http://secrets:8102
      RUNTIME_NETWORK: aos-component                       # a placed container joins the broker-only net (EC2 path)
      RUNTIME_ATTEST: "0"                                  # no docker images to attest in local-dev (and attest's literal is EC2-only)
    depends_on:
      kernel: { condition: service_started }
      vault: { condition: service_healthy }

  # ── the OS the browser talks to (:8099 internal) ────────────────────────────────────────────────────
  app-host:
    <<: *ref
    container_name: airawat-ld-app-host
    env_file: [ ./vault/approle/app-host.env ]   # L1-1b: per-service Vault AppRole (role-id+secret-id); replaces shared VAULT_TOKEN
    networks: [aos-edge, aos-svc, aos-data-secrets]
    command: ["python","reference/app_host.py","/app/components/apps","--port","8099",
              "--network","http://network:8090","--kernel","http://kernel:8080",
              "--identity","http://identity:8093","--scheduler","http://scheduler:8103",
              "--secrets","http://secrets:8102","--decision","http://decision:8096",
              "--workflow","http://workflow:8097","--no-verify-cert"]
    environment:
      <<: *devenv
      FILESTORE_URL: http://filestore:8095
      EMBED_URL: http://model-gateway:8104
      PUBLIC_BASE_URL: "http://localhost:8080"
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_WEBHOOK_SECRET: ""
      # ADR-0124 — app-host mints its own Vault-backed, audience-bound service tokens (component-publisher /
      # dev-sandbox), not passwordless steward/devrick borrows.
      IDENTITY_URL: http://identity:8093
      VAULT_ADDR: http://vault:8200
      SERVICE_TOKEN_AUDIENCE: *aud
      COMPONENT_PUBLISHER_TENANT: localdev-network
      DEV_SANDBOX_TENANT: localdev-developer
      EMBED_CLIENT_TENANT: localdev-operator           # ADR-0124 item (b): embed-service principal's tenant (platform.app_client own-tenant)
      # ADR-0124 item 1 — app-host calls the scheduler's /run,/reload as a DEDICATED least-privilege principal
      # (`app-host`, roles [], recorded audience svc:scheduler), minting a Vault-backed token. bootstrap-dev.sh
      # provisions the credential + the audience allow-list.
      SCHEDULER_CALLER_PRINCIPAL: app-host
      SCHEDULER_CALLER_TENANT: localdev-operator
    volumes:
      - ./prod-guard.sh:/local-dev/prod-guard.sh:ro
      - localdev_appbundles:/data/app-bundles
    depends_on:
      kernel: { condition: service_started }
      identity: { condition: service_started }
      vault: { condition: service_healthy }

  # ── edge: front door on 127.0.0.1:8080 → http://localhost:8080 ───────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: airawat-ld-nginx
    networks: [aos-edge]
    ports: [ "127.0.0.1:8080:80" ]
    volumes: [ ./nginx.conf:/etc/nginx/conf.d/default.conf:ro ]
    depends_on: [ app-host, network ]   # ARC-5: edge proxies only the App Host front door + federation door (no kernel)
    restart: unless-stopped

# ── ARC networks (FIX-PLAN L1 slice-1a, step 2) — per-boundary segmentation replacing the flat default net.
# A container joins ONLY the networks hosting the doors it uses (see ARCHITECTURE-FLOWS-v0.1 §d). The edge is
# isolated from services + data; the fact store is reachable only by the Kernel + the 3 DB-role holders
# (ARC-3; network/identity remain = DEBT-B57, a Layer-2 item); Vault only by its declared minting clients
# (ARC-7; shared token = DEBT-B58). aos-component (step 3) is the broker-only net for placed components.
networks:
  aos-edge: { name: aos-edge }               # internet-adjacent: nginx <-> App Host front door + federation door
  aos-svc: { name: aos-svc }                 # internal service mesh (app/services/kernel doors)
  aos-data-facts: { name: aos-data-facts }   # Postgres fact store <- kernel/network/identity only (ARC-3)
  aos-data-secrets: { name: aos-data-secrets } # Vault <- its declared clients only (ARC-7)
  aos-component: { name: aos-component }      # confined net for placed component containers: only the broker (ARC-1/B52)

volumes:
  localdev_pg: {}
  localdev_vault: {}
  localdev_filestore: {}
  localdev_identity: {}
  localdev_appbundles: {}
  localdev_netfiles: {}
