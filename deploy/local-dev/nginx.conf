# AirawatOS local reverse proxy — single front door on http://localhost.
# The edge exposes ONLY two doors (ARC-5): /network → the federation door (AirawatNetwork authority),
# everything else → the App Host front door (landing, login, desktop, apps, bridges). The Kernel door is
# INTERNAL-ONLY — it is NOT proxied here; reaching it requires being on the services network, not the internet.
# Uses Docker's embedded DNS so a recreated service is re-resolved.
server {
    listen 80 default_server;
    server_name localhost;
    client_max_body_size 64m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location /network/ {
        set $up_network network:8090;
        rewrite ^/network/(.*)$ /$1 break;
        proxy_pass http://$up_network;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ARC-5: the Kernel door is internal-only. The edge refuses /kernel/* outright (was a proxy to kernel:8080 —
    # removed in FIX-PLAN Layer-1 slice-1a). Internal callers reach the Kernel on the services network, not here.
    location /kernel/ {
        return 404;
    }

    location / {
        set $up_app app-host:8099;
        proxy_pass http://$up_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
