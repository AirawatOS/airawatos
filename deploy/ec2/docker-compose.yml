# AirawatOS — EC2 demo stack. Pulls prebuilt manishsv/airawatos-* images (amd64).
# Reverse proxy = nginx on :80 (airos.airawat.org), mirroring the AirOS /network + /<platform> pattern.
#   docker compose -f docker-compose.yml pull && docker compose -f docker-compose.yml up -d
name: airawatos
x-ref: &ref
  image: manishsv/airawatos-reference:0.1.0
  restart: unless-stopped
  depends_on: { kernel: { condition: service_started } }

services:
  postgres:
    image: postgres:16-alpine
    container_name: airawat-postgres
    environment: { POSTGRES_DB: kernel, POSTGRES_USER: kernel, POSTGRES_PASSWORD: kernel }
    volumes: [ kernel_pg:/var/lib/postgresql/data ]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U kernel"], interval: 5s, timeout: 5s, retries: 10 }
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.15
    container_name: airawat-vault
    cap_add: [ IPC_LOCK ]
    environment: { VAULT_ADDR: http://127.0.0.1:8200 }
    volumes:
      - vault_data:/vault/data                                  # PERSISTENT: keys + secrets survive restarts
      - ../vault/vault.hcl:/vault/config/vault.hcl:ro
      - ../vault/entrypoint.sh:/usr/local/bin/airawat-vault-entrypoint.sh:ro
    entrypoint: ["/bin/sh","/usr/local/bin/airawat-vault-entrypoint.sh"]
    healthcheck: { test: ["CMD","vault","status"], interval: 5s, timeout: 3s, retries: 20 }
    restart: unless-stopped

  network:
    image: manishsv/airawatos-network:0.1.0
    container_name: airawat-network
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: kernel
      DB_USER: kernel
      DB_PASSWORD: kernel
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN}
      IDENTITY_JWKS: http://identity:8093/jwks
    depends_on:
      postgres: { condition: service_healthy }
      vault: { condition: service_healthy }
    healthcheck: { test: ["CMD","python","-c","import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/v1/health').status==200 else 1)"], interval: 5s, timeout: 5s, retries: 10 }
    restart: unless-stopped

  kernel:
    image: manishsv/airawatos-kernel:0.1.0
    container_name: airawat-kernel
    environment:
      REGISTRY_BACKEND: postgres
      DB_HOST: postgres
      NETWORK_URL: http://network:8090
      IDENTITY_JWKS: http://identity:8093/jwks
      KERNEL_REQUIRE_STEWARD_GRANT: "1"
      DEV_REQUIRE_DEVELOPER: "1"
      EVENT_SINK: http://automation:8098/events
      SECRETS_URL: http://secrets:8102
      SECRETS_INTERNAL: airawat-broker-secrets-internal
      FILESTORE_URL: http://filestore:8095
      EMBED_URL: http://model-gateway:8104
    depends_on:
      postgres: { condition: service_healthy }
      network: { condition: service_healthy }
    restart: unless-stopped

  # --- reference services (one image, per-service command) ------------------------------------------
  identity:
    <<: *ref
    container_name: airawat-identity
    command: ["python","reference/identity.py"]
    # VAULT_ADDR → a STABLE Ed25519 signing key (Vault transit), so restarting identity does NOT invalidate
    # every issued token (an ephemeral local key would break the kernel's cached JWKS = 401 on all reads).
    environment:
      NETWORK_URL: http://network:8090
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN}
    depends_on:
      network: { condition: service_healthy }
      vault: { condition: service_healthy }

  secrets:
    <<: *ref
    container_name: airawat-secrets
    command: ["python","reference/secrets.py"]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN}
      SECRETS_INTERNAL: airawat-broker-secrets-internal
      IDENTITY_JWKS: http://identity:8093/jwks      # verify admin tokens against the identity JWKS (not localhost)
    depends_on: { vault: { condition: service_healthy } }

  filestore:
    <<: *ref
    container_name: airawat-filestore
    command: ["python","reference/filestore.py","--port","8095"]
    depends_on: {}
    environment:
      FILESTORE_DIR: /data/filestore      # content-addressed blobs (OSM PBFs, uploads) — MUST be on a volume
    volumes:
      - filestore_data:/data/filestore     # PERSISTENT: uploaded assets survive container recreates

  model-gateway:
    <<: *ref
    container_name: airawat-model-gateway
    # Routes /complete + /embed by the registered intelligence.provider (airawat-hosted → kimi-k3 @
    # llm.airawat.org). The provider's API key is read from Vault (set via the Components app UI), NOT here.
    command: ["python","reference/model_gateway.py","--kernel","http://kernel:8080","--vault","http://vault:8200","--vault-token","${VAULT_TOKEN}"]

  notify:
    <<: *ref
    container_name: airawat-notify
    command: ["python","reference/notify.py","--kernel","http://kernel:8080"]

  workflow:
    <<: *ref
    container_name: airawat-workflow
    command: ["python","reference/workflow.py","--kernel","http://kernel:8080","--network","http://network:8090"]

  decision:
    <<: *ref
    container_name: airawat-decision
    command: ["python","reference/decision.py","--kernel","http://kernel:8080","--network","http://network:8090","--workflow","http://workflow:8097"]

  automation:
    <<: *ref
    container_name: airawat-automation
    command: ["python","reference/automation.py","--kernel","http://kernel:8080"]

  event-relay:
    <<: *ref
    container_name: airawat-event-relay
    command: ["python","reference/event_relay.py","--kernel","http://kernel:8080","--automation","http://automation:8098"]

  # PLACEMENT AUTHORITY (ADR-0030/0051): the only service that holds the docker socket. Orchestrators
  # (scheduler, city-baseline pipeline) POST /v1/invoke here; it cert-checks + image-locks the runtime,
  # materialises secrets, and `docker run`s the certified runtime image (or runs keyless drivers in-process
  # in THIS container). Driver code is mounted from the HOST components path (same path in + out of the
  # container) so the host docker daemon can bind it into the runtime container.
  runtime-manager:
    <<: *ref
    container_name: airawat-runtime-manager
    command: ["python","reference/runtime_manager.py","--port","8105"]
    environment:
      COMPONENTS_ROOT: /home/ec2-user/airawatos/rt-components
      RUNTIME_MANAGER_INTERNAL: airawat-runtime-mgr-internal
      RUNTIME_NETWORK: airawatos_default
      KERNEL_ALIAS: kernel
      AIRAWAT_API: http://kernel:8080
      NETWORK_URL: http://network:8090
      SECRETS_URL: http://secrets:8102
      SECRETS_INTERNAL: airawat-broker-secrets-internal
      LAUNCHER_REQUIRE_CERTIFIED_IMAGE: "1"
      LAUNCH_TIMEOUT: "1700"     # per-run docker-run cap; footprints does ~250 GEE per-cell fetches (~5s each)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ec2-user/airawatos/rt-components:/home/ec2-user/airawatos/rt-components:ro
    depends_on: [kernel, secrets, network]

  scheduler:
    <<: *ref
    container_name: airawat-scheduler
    command: ["python","reference/scheduler.py","--components-root","/app/components","--kernel","http://kernel:8080","--network","http://network:8090"]
    environment:
      RUNTIME_MANAGER_URL: http://runtime-manager:8105
      RUNTIME_MANAGER_INTERNAL: airawat-runtime-mgr-internal

  app-host:
    <<: *ref
    container_name: airawat-app-host
    command: ["python","reference/app_host.py","/app/components/apps","--port","8099",
              "--network","http://network:8090","--kernel","http://kernel:8080",
              "--identity","http://identity:8093","--scheduler","http://scheduler:8103",
              "--secrets","http://secrets:8102","--decision","http://decision:8096",
              "--workflow","http://workflow:8097","--no-verify-cert"]
    environment:
      FILESTORE_URL: http://filestore:8095
      EMBED_URL: http://model-gateway:8104
      # the city-baseline pipeline (spawned here) delegates driver placement to the runtime-manager
      RUNTIME_MANAGER_URL: http://runtime-manager:8105
      RUNTIME_MANAGER_INTERNAL: airawat-runtime-mgr-internal
    depends_on:
      kernel: { condition: service_started }
      identity: { condition: service_started }

  nginx:
    image: nginx:alpine
    container_name: airawat-nginx
    volumes: [ ./nginx.conf:/etc/nginx/conf.d/default.conf:ro ]
    ports: [ "80:80" ]
    depends_on: [ app-host, network, kernel ]
    restart: unless-stopped

volumes:
  kernel_pg: {}
  vault_data: {}
  filestore_data: {}
