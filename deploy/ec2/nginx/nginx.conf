# AirawatOS reverse proxy — airos.airawat.org.
# Captured live from ec2-user@13.205.13.220:/home/ec2-user/airawatos/nginx.conf on 2026-11-06
# (sha256 db08240e8c5abafbbcdc72d30492547e13d8a074053c2d85a431d341acbb137a). This is the ON-BOX proxy
# (airawat-nginx container, :80); a separate edge host (13.61.56.103) terminates TLS and forwards here.
server {
    listen 80;
    server_name airos.airawat.org;
    client_max_body_size 64m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /network/ {
        set $up_network network:8090;
        rewrite ^/network/(.*)$ /$1 break;
        proxy_pass http://$up_network;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- OS kernel API: NO public route (internal kernel:8080 only). ---

    location /kc/ {
        set $up_kc keycloak:8080;
        proxy_pass http://$up_kc;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    location / {
        set $up_app app-host:8099;
        proxy_pass http://$up_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
