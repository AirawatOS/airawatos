# AirawatOS reverse proxy — airos.airawat.org.
# Captured live from ec2-user@13.205.13.220:/home/ec2-user/airawatos/nginx.conf on 2026-11-06
# (sha256 4a18d55a1529c614d0f7de26b56e5ee75b5ad1cebf90ed5b9b2fc524629d4536). On-box proxy (airawat-nginx :80); a separate edge host (13.61.56.103) terminates TLS.
# DEBT-B33/B34 containment applied 2026-11-06: POST /network/v1/{grants,grants/revoke,participants} -> 403.
server {
    listen 80;
    server_name airos.airawat.org;
    client_max_body_size 64m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SECURITY CONTAINMENT (DEBT-B33/B34) — block unauthenticated federation-key + grant writes at the edge.
    # Internal service-to-service calls (app-host:8099 -> network:8090) are unaffected; this only gates /network/.
    location = /network/v1/grants         { return 403; }
    location = /network/v1/grants/revoke  { return 403; }
    location = /network/v1/participants {
        if ($request_method != GET) { return 403; }
        set $up_network network:8090;
        rewrite ^/network/(.*)$ /$1 break;
        proxy_pass http://$up_network;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /network/ {
        set $up_network network:8090;
        rewrite ^/network/(.*)$ /$1 break;
        proxy_pass http://$up_network;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- OS kernel API: NO public route (internal kernel:8080 only). ---

    location /kc/ {
        set $up_kc keycloak:8080;
        proxy_pass http://$up_kc;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    location / {
        set $up_app app-host:8099;
        proxy_pass http://$up_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
