# AirawatOS reverse proxy — airos.airawat.org.
# Mirrors the AirOS gateway pattern: /network → the AirawatNetwork authority, /kernel → the OS kernel API,
# and everything else → the app-host (the platform: login, desktop, apps, bridges).
server {
    listen 80;
    server_name airos.airawat.org;
    client_max_body_size 64m;                    # knowledge doc uploads etc.

    # --- AirawatNetwork authority API ---
    location /network/ {
        proxy_pass http://network:8090/;         # trailing slash strips the /network prefix
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- OS kernel API (broker + registry) ---
    location /kernel/ {
        proxy_pass http://kernel:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- the PLATFORM: app-host serves /login, /, /apps/<id>/, /bridge/*, /run at the root ---
    location / {
        proxy_pass http://app-host:8099;         # no trailing slash — preserve the full path
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;                  # model-backed bridges (Solution Expert, chat) can be slow
    }
}
